[build]
  base    = "."
  command = "npm run build"
  publish = "dist"

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "camera=(), microphone=(), geolocation=()"

# Cache JS/CSS vendor chunks aggressively — filenames are content-hashed
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images for 1 week
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Serve pre-compressed .br files when browser supports brotli
[[headers]]
  for = "/assets/*.br"
  [headers.values]
    Content-Encoding = "br"
    Cache-Control    = "public, max-age=31536000, immutable"

# Serve pre-compressed .gz files when browser supports gzip
[[headers]]
  for = "/assets/*.gz"
  [headers.values]
    Content-Encoding = "gzip"
    Cache-Control    = "public, max-age=31536000, immutable"

# SPA fallback — all routes → index.html (also handled by public/_redirects)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
